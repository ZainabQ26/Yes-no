<div class="modal-container" id="modal">
    <div class="ui-screen" id="uiScreen">
        <h2>Confirm Deletion</h2>
        <p>Are you absolutely sure?</p>
        <div class="btn-group">
            <button id="yesBtn" class="btn yes">Yes</button>
            <button id="noBtn" class="btn no">No</button>
        </div>
    </div>

    <div class="game-screen hidden" id="gameScreen">
        <div class="pegs-container">
            </div>
        <div class="ball" id="puck"></div>
        <div class="slots">
            <div class="slot no-slot">NO</div>
            <div class="slot yes-slot">YES</div>
        </div>
    </div>
</div>
